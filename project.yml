name: UsageAI

options:
  bundleIdPrefix: io.github.jpleopoldino
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  UsageAI:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/UI
      - path: Resources
        excludes:
          - Info.plist
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - target: UsageCore
        embed: false
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Usage AI
        CFBundleName: Usage AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 João Pedro Leopoldino. MIT License."
    settings:
      base:
        PRODUCT_NAME: Usage AI
        PRODUCT_MODULE_NAME: UsageAI
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).UsageAI
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  # Static, so it is linked into the app: an ad-hoc signed app with the hardened runtime
  # can't load an embedded dynamic framework (library validation needs a Team ID).
  UsageCore:
    type: framework.static
    platform: macOS
    sources:
      - Sources/Core
      - Sources/Providers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).UsageCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  UsageCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/UsageCoreTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: UsageCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).UsageCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  UsageAI:
    build:
      targets:
        UsageAI: all
        UsageCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - UsageCoreTests
    archive:
      config: Release
  UsageAI-ptBR:
    build:
      targets:
        UsageAI: all
    run:
      config: Debug
      commandLineArguments:
        "-AppleLanguages (pt-BR)": true
